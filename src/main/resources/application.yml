spring:
  application:
    name: mini-exchange
  threads:
    # Watek zadania czeka na odpowiedz silnika (join). Watki wirtualne czekaja prawie za darmo,
    # wiec tysiac oczekujacych zadan nie zjada tysiaca watkow systemowych.
    virtual:
      enabled: true
  datasource:
    # Dla bootRun adres podaje docker compose (compose.yaml), w testach Testcontainers.
    # Te wartosci sa dla recznie uruchomionego jara z lokalna baza.
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
    hikari:
      # Watek event-writer ponawia zapis, gdy baza lezy. Krotki limit = szybciej wie, ze
      # trzeba ponowic, i nie przetrzymuje zamykania aplikacji (domyslnie 30 s).
      connection-timeout: 2000 # ms; Hikari nie rozumie zapisu "2s"
      data-source-properties:
        # Polaczenie juz wziete, a baza zawisla w polowie zapytania: bez limitu sterownik
        # czekalby w nieskonczonosc, a za watkiem event-writer stanelaby cala gielda. W sekundach.
        socketTimeout: 5
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      # Zapis potwierdzony przez wszystkie repliki i producent idempotentny: ponowienie po bledzie
      # sieci nie zdubluje wiadomosci w partycji ani nie zamieni kolejnosci. W Kafce 3+ to domyslne,
      # tu jawnie, bo od tego zalezy poprawnosc outboxa.
      acks: all
      properties:
        enable.idempotence: true
        # Domyslnie send() potrafi wisiec 60 s na metadanych, gdy brokera nie ma -- a relay
        # trzyma w tym czasie transakcje z zablokowanymi wierszami.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jackson:
    # Domyslnie Jackson jest poblazliwy: "quantity": 10.9 obcialby do 10, a "side": 1
    # zamienil na SELL (indeks w enumie). Na gieldzie wolimy 400 niz zgadywanie.
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

exchange:
  # Spolki z GPW. Kazda dostaje wlasny watek silnika i wlasna kolejke.
  symbols: [CDR, PKO, PKN, PZU, KGH, ALE]
  queue-capacity: 10000
  request-timeout: 5s
  outbox:
    poll-interval: 100ms
    batch-size: 500
    # Dluzej niz delivery.timeout.ms producenta: to producent ma zglosic blad, nie my.
    send-timeout: 15s
  market-data:
    # Obraz arkusza spolki najwyzej co tyle (tylko gdy sie zmienil). Transakcje ida od razu.
    book-interval: 100ms
    book-levels: 10
    # Tyle wiadomosci moze czekac na klienta; wiecej = klient nie nadaza i jest rozlaczany.
    client-queue: 1000
    # Paczki zdarzen czekajace na hub. Pelna kolejka = notowania gubia paczke (handel nie czeka).
    hub-queue: 10000
    max-clients: 1000
  bots:
    # Wlaczane profilem demo: ./gradlew bootRun --args='--spring.profiles.active=demo'
    enabled: false
    tick-interval: 200ms
    volatility: 0.001
    spread-bps: 20
    maker-quantity: 50
    noise-probability: 0.6
    price-source-url: https://query1.finance.yahoo.com
    # Gdy zrodlo rynkowe nie odpowie (zlotowki, mniej wiecej kursy z pazdziernika 2026).
    fallback-prices:
      CDR: 263.00
      PKO: 113.94
      PKN: 159.34
      PZU: 71.76
      KGH: 347.00
      ALE: 51.75
