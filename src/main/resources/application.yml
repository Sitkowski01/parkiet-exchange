spring:
  application:
    name: mini-exchange
  threads:
    # Watek zadania czeka na odpowiedz silnika (join). Watki wirtualne czekaja prawie za darmo,
    # wiec tysiac oczekujacych zadan nie zjada tysiaca watkow systemowych.
    virtual:
      enabled: true
  datasource:
    # Dla bootRun adres podaje docker compose (compose.yaml), w testach Testcontainers.
    # Te wartosci sa dla recznie uruchomionego jara z lokalna baza.
    url: jdbc:postgresql://localhost:5432/exchange
    username: exchange
    password: exchange
    hikari:
      # Watek event-writer ponawia zapis, gdy baza lezy. Krotki limit = szybciej wie, ze
      # trzeba ponowic, i nie przetrzymuje zamykania aplikacji (domyslnie 30 s).
      connection-timeout: 2000 # ms; Hikari nie rozumie zapisu "2s"
      data-source-properties:
        # Polaczenie juz wziete, a baza zawisla w polowie zapytania: bez limitu sterownik
        # czekalby w nieskonczonosc, a za watkiem event-writer stanelaby cala gielda. W sekundach.
        socketTimeout: 5
  jackson:
    # Domyslnie Jackson jest poblazliwy: "quantity": 10.9 obcialby do 10, a "side": 1
    # zamienil na SELL (indeks w enumie). Na gieldzie wolimy 400 niz zgadywanie.
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        fail-on-numbers-for-enums: true

exchange:
  # Spolki z GPW. Kazda dostaje wlasny watek silnika i wlasna kolejke.
  symbols: [CDR, PKO, PKN, PZU, KGH, ALE]
  queue-capacity: 10000
  request-timeout: 5s
