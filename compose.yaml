# Baza i broker do pracy lokalnej. ./gradlew bootRun podnosi je sam (spring-boot-docker-compose)
# i podaje aplikacji adresy, uzytkownika i haslo -- nie trzeba ich nigdzie wpisywac.
# Calosc w kontenerach, bez Javy na komputerze: docker compose --profile app up --build
services:
  # Sama gielda z obrazu (Dockerfile). Profil app: bootRun go nie startuje, bo uruchamia aplikacje sam.
  # Domyslnie z botami i wznowieniem z dziennika; PARKIET_PROFILE= i PARKIET_RESUME=false = pusta gielda (e2e).
  parkiet:
    build: .
    image: ghcr.io/sitkowski01/parkiet-exchange:latest
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/exchange
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_PROFILES_ACTIVE: ${PARKIET_PROFILE-demo}
      EXCHANGE_JOURNAL_RESUME: ${PARKIET_RESUME:-true}
    ports:
      - "${PARKIET_PORT:-8080}:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    ports:
      - "5432"
    # Gielda w kontenerze czeka na baze: Flyway na starcie nie ponawia polaczenia.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "exchange", "-d", "exchange"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka w trybie KRaft (bez ZooKeepera), jeden wezel. Staly port, bo broker oglasza
  # klientom adres localhost:9092 -- przy losowym porcie klient dostalby zly adres.
  # Drugi listener (INTERNAL, kafka:19092) dla gieldy w kontenerze: tam localhost to ona sama.
  kafka:
    image: apache/kafka-native:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

  # Monitoring tylko na zyczenie: docker compose --profile monitoring up -d
  # Grafana: http://localhost:3000 (dashboard "Parkiet"), Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/parkiet.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
