# Baza i broker do pracy lokalnej. ./gradlew bootRun podnosi je sam (spring-boot-docker-compose)
# i podaje aplikacji adresy, uzytkownika i haslo -- nie trzeba ich nigdzie wpisywac.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    ports:
      - "5432"

  # Kafka w trybie KRaft (bez ZooKeepera), jeden wezel. Staly port, bo broker oglasza
  # klientom adres localhost:9092 -- przy losowym porcie klient dostalby zly adres.
  kafka:
    image: apache/kafka-native:4.2.1
    ports:
      - "9092:9092"

  # Monitoring tylko na zyczenie: docker compose --profile monitoring up -d
  # Grafana: http://localhost:3000 (dashboard "Parkiet"), Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/parkiet.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
